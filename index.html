<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahalawu Agromina System</title>
  <link rel="manifest" href="manifest.json">

  <!-- LOGO / FAVICON -->
  <link rel="icon" type="image/png" href="https://mahalawu.github.io/agromina/fish.png">
  <link rel="apple-touch-icon" href="https://mahalawu.github.io/agromina/fish.png">

  <!-- METADATA PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agromina">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- URL EXEC WEB APP GAS AGROMINA -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyQzAGvVdTqLtbzM8dM0WsQrdxA3ahk_XzjODaMTvfbRWfi16DKUQjHo5JQOm3urEY/exec" 
    allow="geolocation; microphone; camera"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>

  <!-- Halaman Fullscreen Offline -->
  <div id="offline-screen" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #f8fafc;
    color: #1e293b;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    z-index: 99999;
  ">
    <div style="font-size: 64px; margin-bottom: 16px;">📡</div>
    <h2 style="font-family: sans-serif; font-size: 20px; font-weight: bold; margin-bottom: 8px; color: #0f766e;">
      Koneksi Terputus
    </h2>
    <p style="font-family: sans-serif; font-size: 14px; color: #64748b; max-width: 280px; margin-bottom: 24px; line-height: 1.5;">
      Aplikasi Mahalawu Agromina membutuhkan koneksi internet untuk memuat data.
    </p>
    <button onclick="reloadApp()" style="
      padding: 12px 28px;
      background-color: #0f766e;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    ">
      Coba Lagi / Muat Ulang
    </button>
  </div>

  <script>
    const offlineScreen = document.getElementById('offline-screen');
    const appIframe = document.querySelector('iframe');

    function reloadApp() {
      if (appIframe) {
        appIframe.src = appIframe.src;
      }
    }

    function updateOnlineStatus() {
      if (navigator.onLine) {
        offlineScreen.style.display = 'none';
        reloadApp();
      } else {
        offlineScreen.style.display = 'flex';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>

  <!-- FIREBASE SDK (Modul Notifikasi) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAMDSJMXm1eFGUM8bTZEWWM-OcnR-S28jE",
      authDomain: "agromina-notification.firebaseapp.com",
      projectId: "agromina-notification",
      storageBucket: "agromina-notification.firebasestorage.app",
      messagingSenderId: "744536343620",
      appId: "1:744536343620:web:21572e60b3558d759d2811"
    };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    if ('serviceWorker' in navigator && 'Notification' in window) {
      navigator.serviceWorker.register('sw.js').then(registration => {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            messaging.getToken({ 
              serviceWorkerRegistration: registration,
              vapidKey: 'BMxrfSAbPYoQS4afzp9xfWi09pfACSs-byIN1yFT7MnDGG1XAC7KCJf9EtJclDsK4yPu8jTYdu2GSKAUEGxlg' 
            }).then(currentToken => {
              if (currentToken) {
                console.log('FCM Token Operator:', currentToken);
              }
            }).catch(err => {
              console.error('Gagal mengambil token FCM:', err);
            });
          }
        });
      });
    }
  </script>

</body>
</html>
