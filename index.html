<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahalawu Agromina System</title>
  <link rel="manifest" href="manifest.json">

  <!-- 1. LOGO / FAVICON CUSTOM KAMU (Ganti URL gambar ini dengan link logo kamu) -->
  <link rel="icon" type="image/png" href="https://mahalawu.github.io/agromina/fish.png">
  <link rel="apple-touch-icon" href="https://mahalawu.github.io/agromina/fish.png">

  <!-- 2. METADATA UNTUK SHORTCUT / PWA HP -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agromina">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 3. PASTA-KAN URL EXEC WEB APP GAS KAMU DI SINI -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyQzAGvVdTqLtbzM8dM0WsQrdxA3ahk_XzjODaMTvfbRWfi16DKUQjHo5JQOm3urEY/exec" 
    allow="geolocation; microphone; camera"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>

<script>
  if (typeof navigator.serviceWorker !== 'undefined') {
    navigator.serviceWorker.register('sw.js')
  }
</script>

  <!-- Banner Notifikasi Offline & Tombol Reload -->
<div id="offline-banner" style="
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: #ef4444;
  color: white;
  text-align: center;
  padding: 10px 12px;
  font-family: sans-serif;
  font-size: 13px;
  font-weight: bold;
  z-index: 9999;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
">
  <span>⚠️ Koneksi terputus. Anda sedang dalam mode offline.</span>
  <button id="reload-btn" onclick="reloadApp()" style="
    margin-left: 8px;
    padding: 4px 10px;
    background-color: white;
    color: #ef4444;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
  ">Muat Ulang</button>
</div>

<script>
  const offlineBanner = document.getElementById('offline-banner');
  const appIframe = document.querySelector('iframe'); // Mengambil element iframe GAS kamu

  function reloadApp() {
    if (appIframe) {
      // Reload ulang src iframe tanpa merefresh seluruh aplikasi
      appIframe.src = appIframe.src;
    }
  }

  function updateOnlineStatus() {
    if (navigator.onLine) {
      offlineBanner.style.display = 'none';
      // OTOMATIS RELOAD IFRAME BEGITU KONEKSI KEMBALI ONLINE
      reloadApp();
    } else {
      offlineBanner.style.display = 'block';
    }
  }

  // Cek status koneksi secara real-time
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  
  // Jalankan cek status saat pertama kali dibuka
  updateOnlineStatus();
</script>
  
</body>
</html>
