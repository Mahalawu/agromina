<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahalawu Agromina System</title>
  <link rel="manifest" href="manifest.json">

  <!-- 1. LOGO / FAVICON CUSTOM KAMU (Ganti URL gambar ini dengan link logo kamu) -->
  <link rel="icon" type="image/png" href="https://mahalawu.github.io/agromina/fish.png">
  <link rel="apple-touch-icon" href="https://mahalawu.github.io/agromina/fish.png">

  <!-- 2. METADATA UNTUK SHORTCUT / PWA HP -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agromina">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 3. PASTA-KAN URL EXEC WEB APP GAS KAMU DI SINI -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyQzAGvVdTqLtbzM8dM0WsQrdxA3ahk_XzjODaMTvfbRWfi16DKUQjHo5JQOm3urEY/exec" 
    allow="geolocation; microphone; camera"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>

<script>
  // Registrasi Service Worker & Meminta Izin Notifikasi
  if ('serviceWorker' in navigator && 'Notification' in window) {
    navigator.serviceWorker.register('sw.js').then(registration => {
      console.log('Service Worker terpasang!');

      // Minta izin notifikasi ke Operator HP saat aplikasi dibuka
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          console.log('Izin notifikasi diberikan!');
        } else {
          console.log('Izin notifikasi ditolak/dilewati.');
        }
      });
    });
  }
</script>

<!-- Halaman Fullscreen Offline -->
<div id="offline-screen" style="
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #f8fafc;
  color: #1e293b;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 99999;
">
  <!-- Ikon Sinyal/Offline -->
  <div style="font-size: 64px; margin-bottom: 16px;">📡</div>
  
  <h2 style="font-family: sans-serif; font-size: 20px; font-weight: bold; margin-bottom: 8px; color: #0f766e;">
    Koneksi Terputus
  </h2>
  
  <p style="font-family: sans-serif; font-size: 14px; color: #64748b; max-width: 280px; margin-bottom: 24px; line-height: 1.5;">
    Aplikasi Mahalawu Agromina membutuhkan koneksi internet untuk memuat data.
  </p>

  <button onclick="reloadApp()" style="
    padding: 12px 28px;
    background-color: #0f766e;
    color: white;
    border: none;
    border-radius: 8px;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    cursor: pointer;
  ">
    Coba Lagi / Muat Ulang
  </button>
</div>

<script>
  const offlineScreen = document.getElementById('offline-screen');
  const appIframe = document.querySelector('iframe'); // Mengambil element iframe GAS kamu

  function reloadApp() {
    if (appIframe) {
      appIframe.src = appIframe.src;
    }
  }

  function updateOnlineStatus() {
    if (navigator.onLine) {
      offlineScreen.style.display = 'none';
      reloadApp(); // Auto-reload begitu online lagi
    } else {
      offlineScreen.style.display = 'flex'; // Tampilkan layar penuh
    }
  }

  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  
  updateOnlineStatus();
</script>
  
</body>
</html>
